<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informasi &amp; Publikasi — KLH/BPLH</title>
<meta name="description" content="Indeks berita, siaran pers, pengumuman, artikel, publikasi, dan regulasi KLH/BPLH.">
<link rel="icon" type="image/png" href="../../assets/img/klh-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body>
<script>window.KLH_ROOT = '../../';</script>
<script src="../../assets/js/components/icons.js"></script>
<script src="../../assets/js/data/menu.js"></script>
<script src="../../assets/js/data/content.js"></script>
<script src="../../assets/js/components/navbar.js"></script>
<script src="../../assets/js/components/footer.js"></script>
<script src="../../assets/js/components/widgets.js"></script>

<klh-navbar active="informasi"></klh-navbar>

<main id="konten">
  <section class="page-hero" style="padding-bottom:var(--s12)">
    <div class="container">
      <nav aria-label="Jejak navigasi"><ol class="breadcrumb">
        <li><a href="../../index.html">Beranda</a></li>
        <li><a href="indeks.html?m=berita">Informasi &amp; Publikasi</a></li>
        <li aria-current="page" id="bc-current">Berita</li>
      </ol></nav>
      <span class="eyebrow">Informasi &amp; Publikasi</span>
      <h1 id="m-title">Berita</h1>
      <p class="lead" id="m-desc"></p>
    </div>
    <span id="hero-leaf"></span>
  </section>

  <section class="section">
    <div class="container idx-layout">
      <!-- Sidebar 9 modul -->
      <nav class="idx-side" aria-label="Modul informasi" id="m-side"></nav>

      <div>
        <div style="display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:var(--s6)">
          <form class="input-group" role="search" style="flex:0 1 380px" onsubmit="return false">
            <input class="input" type="search" id="m-search" placeholder="Saring judul pada modul ini…" aria-label="Saring judul">
            <button class="btn btn-primary" type="submit" aria-label="Cari"><klh-icon name="search" class="icon icon--sm"></klh-icon></button>
          </form>
          <span style="font-size:var(--t-sm);color:var(--ink-500)" id="m-count" aria-live="polite"></span>
        </div>

        <div class="grid grid--2" id="m-list" aria-live="polite"></div>

        <nav class="pager" aria-label="Navigasi halaman" style="margin-top:var(--s10)">
          <a href="#" aria-label="Halaman sebelumnya"><klh-icon name="arrowleft" class="icon icon--sm"></klh-icon></a>
          <span class="on" aria-current="page">1</span>
          <a href="#">2</a><a href="#">3</a><span class="gap">…</span><a href="#">8</a>
          <a href="#" aria-label="Halaman berikutnya"><klh-icon name="arrowright" class="icon icon--sm"></klh-icon></a>
        </nav>
      </div>
    </div>
  </section>
</main>

<klh-footer></klh-footer>
<klh-widgets></klh-widgets>
<script src="../../assets/js/main.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('hero-leaf').outerHTML = KLH.leafmark();

  var cur = KLH.qs('m') || 'berita';
  var mod = KLH.modules.find(function (m) { return m.slug === cur; }) || KLH.modules[0];
  cur = mod.slug;

  document.title = mod.label + ' — Informasi & Publikasi KLH/BPLH';
  document.getElementById('bc-current').textContent = mod.label;
  document.getElementById('m-title').textContent = mod.label;
  document.getElementById('m-desc').textContent = mod.desc;

  /* Sidebar 9 modul (agenda & video punya halaman khusus) */
  document.getElementById('m-side').innerHTML = KLH.modules.map(function (m) {
    var href = m.href ? (window.KLH_ROOT + m.href) : ('indeks.html?m=' + m.slug);
    return '<a href="' + href + '"' + (m.slug === cur ? ' class="on" aria-current="page"' : '') + '>' +
      KLH.iconSVG(m.icon, 'icon icon--sm') + m.label + '</a>';
  }).join('');

  /* Daftar kartu — modul kosong diisi placeholder wajar */
  var items = KLH.articles.filter(function (a) { return a.module === cur; });
  var listBox = document.getElementById('m-list');
  var countBox = document.getElementById('m-count');

  function render(q) {
    var shown = items.filter(function (a) { return !q || a.title.toLowerCase().indexOf(q) > -1; });
    countBox.textContent = shown.length + ' konten ditampilkan';
    if (!shown.length) {
      listBox.innerHTML = '<div class="alert alert-info" style="grid-column:1/-1">' + KLH.iconSVG('search', 'icon icon--sm') +
        '<div><strong>Belum ada konten yang cocok.</strong>Konten modul ini akan terisi dari CMS. Coba kata kunci lain atau lihat modul berbeda.</div></div>';
      return;
    }
    listBox.innerHTML = shown.map(function (a) { return KLH.newsCard(a); }).join('');
    Array.prototype.forEach.call(listBox.querySelectorAll('[data-reveal]'), function (n) { n.classList.add('is-in'); });
  }
  render('');

  document.getElementById('m-search').addEventListener('input', function (e) {
    render(e.target.value.trim().toLowerCase());
  });
})();
</script>
</body>
</html>
