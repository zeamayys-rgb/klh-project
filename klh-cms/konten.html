<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konten Website Utama — CMS Konten KLH/BPLH</title>
<meta name="description" content="Kelola berita, pengumuman, dan halaman program Website Utama KLH/BPLH — filter status, cari, dan sunting.">
<link rel="icon" type="image/png" href="assets/img/klh-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="app">
<a class="skip" href="#konten">Lewati ke konten utama</a>
<script>window.KLH_ROOT = '';</script>
<script src="assets/js/components/icons.js"></script>
<script src="assets/js/data/cms.js"></script>
<script src="assets/js/components/cmsshell.js"></script>

<klh-sidebar></klh-sidebar>
<div class="app-main">
  <klh-topbar judul="Konten Website Utama"></klh-topbar>

  <main id="konten" class="content">
    <div class="page-head" data-reveal>
      <div>
        <h1>Konten Website Utama</h1>
        <p class="lead">Berita, pengumuman, dan materi program yang tayang di <strong>Website Utama KLH/BPLH</strong>.</p>
      </div>
      <div class="aksi">
        <a class="btn btn-primary" href="konten-edit.html"><klh-icon name="newspaper" class="icon icon--sm"></klh-icon> Tulis konten</a>
      </div>
    </div>

    <div class="toolbar panel" data-reveal>
      <div class="tb-search" role="search" style="max-width:320px;flex:1;margin-left:0;margin-right:auto">
        <klh-icon name="search" class="icon icon--sm"></klh-icon>
        <input type="search" id="cari" placeholder="Cari judul atau ID…" aria-label="Cari konten">
      </div>
      <div class="filterbar" style="border:0;background:none;padding:0" role="group" aria-label="Filter status">
        <button class="fchip on" type="button" data-st="semua" aria-pressed="true">Semua</button>
        <button class="fchip" type="button" data-st="terbit" aria-pressed="false">Terbit</button>
        <button class="fchip" type="button" data-st="review" aria-pressed="false">Menunggu Review</button>
      </div>
    </div>

    <section data-reveal aria-label="Daftar konten">
      <div class="tbl-wrap" style="border:0">
        <table class="tbl" aria-label="Daftar konten Website Utama">
          <thead><tr>
            <th scope="col">Judul</th><th scope="col">Penulis</th>
            <th scope="col">Status</th><th scope="col">Diperbarui</th><th scope="col"><span class="sr-only">Aksi</span></th>
          </tr></thead>
          <tbody id="tb-konten"></tbody>
        </table>
      </div>
      <p id="kosong" class="demo-note" hidden><klh-icon name="search" class="icon icon--sm"></klh-icon> Tidak ada konten yang cocok dengan filter/kata kunci.</p>
    </section>

    <dialog class="rte-dlg" id="dlg-publish" aria-label="Konfirmasi publikasi">
      <h2 style="margin:0 0 var(--s3);font-size:var(--t-h4)"><klh-icon name="globe" class="icon icon--sm"></klh-icon> Publikasikan konten</h2>
      <p id="publish-judul" style="font-size:var(--t-sm);color:var(--ink-700);margin:0 0 var(--s4)">—</p>
      <label style="display:flex;align-items:flex-start;gap:var(--s3);cursor:pointer;margin-bottom:var(--s5)">
        <input type="checkbox" id="publish-cek" style="margin-top:3px;width:18px;height:18px;accent-color:var(--g-600);flex:none">
        <span style="font-size:var(--t-sm)">Saya memastikan konten ini sudah diperiksa dan akan <strong>dipublikasikan di Website Utama KLH/BPLH</strong>.</span>
      </label>
      <div style="display:flex;gap:var(--s3);justify-content:flex-end">
        <button class="btn btn-ghost" type="button" data-batal>Batal</button>
        <button class="btn btn-primary" type="button" id="publish-ok" disabled><klh-icon name="globe" class="icon icon--sm"></klh-icon> Publikasikan</button>
      </div>
    </dialog>

  </main>
</div>

<script src="assets/js/main.js"></script>
<script>
(function () {
  'use strict';
  var data = KLH.cms.artikel.slice();
  var stAktif = 'semua', kat = '', q = '';

  var tb = document.getElementById('tb-konten');
  var kosong = document.getElementById('kosong');

  /* ---- Mode halaman kategori (?kategori=<slug>) ---- */
  var KAT = KLH.cms.kategoriKonten;
  var kd = KAT.filter(function (k) { return k.slug === KLH.qs('kategori'); })[0];
  if (kd) {
    kat = kd.label;
    document.querySelector('.page-head h1').textContent = kd.label;
    document.title = kd.label + ' — CMS Konten KLH/BPLH';
    var tbJudul = document.querySelector('.tb-title strong');
    if (tbJudul) tbJudul.textContent = kd.label;
    var btnTulis = document.querySelector('.page-head .aksi .btn-primary');
    btnTulis.href = 'konten-edit.html?kategori=' + kd.slug;
    btnTulis.innerHTML = '<klh-icon name="' + kd.icon + '" class="icon icon--sm"></klh-icon> Tulis ' + kd.label;
  }

  function render() {
    var rows = data.filter(function (a) {
      return (stAktif === 'semua' || a.status === stAktif) &&
             (!kat || a.kategori === kat) &&
             (!q || (a.judul + ' ' + a.id).toLowerCase().indexOf(q) !== -1);
    });
    tb.innerHTML = rows.map(function (a) {
      return '<tr data-id="' + a.id + '">' +
        '<td><strong>' + a.judul + '</strong><br><span class="mono" style="font-family:var(--font-mono);font-size:var(--t-xs);color:var(--ink-400)">' + a.id + '</span></td>' +
        '<td>' + a.penulis + '</td>' +
        '<td>' + KLH.statusBadge(a.status) + '</td>' +
        '<td class="mono" style="font-family:var(--font-mono);font-size:var(--t-xs);white-space:nowrap">' + KLH.fmtDateTime(a.t) + '</td>' +
        '<td><div class="row-aksi">' +
          '<a href="konten-edit.html?id=' + a.id + '" aria-label="Sunting ' + a.id + '" title="Sunting">' + KLH.iconSVG('document', 'icon icon--sm') + '</a>' +
          /* ponytail: publish tampil untuk semua peran — pembatasan verifikator/admin menyusul dari engineer */
          (a.status !== 'terbit'
            ? '<button type="button" data-publish="' + a.id + '" aria-label="Publikasikan ' + a.id + '" title="Publikasikan">' + KLH.iconSVG('globe', 'icon icon--sm') + '</button>'
            : '') +
          '<button type="button" class="hapus" data-hapus="' + a.id + '" aria-label="Hapus ' + a.id + '" title="Hapus">' + KLH.iconSVG('close', 'icon icon--sm') + '</button>' +
        '</div></td></tr>';
    }).join('');
    kosong.hidden = rows.length > 0;
  }

  /* Filter status via chip + dukung ?status= dari halaman lain */
  var chips = document.querySelectorAll('[data-st]');
  function setStatus(st) {
    stAktif = st;
    Array.prototype.forEach.call(chips, function (c) {
      var on = c.getAttribute('data-st') === st;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', String(on));
    });
    render();
  }
  Array.prototype.forEach.call(chips, function (c) {
    c.addEventListener('click', function () { setStatus(c.getAttribute('data-st')); });
  });
  var qsStatus = KLH.qs('status');
  if (qsStatus && document.querySelector('[data-st="' + qsStatus + '"]')) setStatus(qsStatus);

  document.getElementById('cari').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });

  /* Publikasikan: konfirmasi checkbox sebelum tayang di Website Utama */
  var dlgPub = document.getElementById('dlg-publish');
  var cekPub = document.getElementById('publish-cek');
  var okPub = document.getElementById('publish-ok');
  var idPub = null;
  cekPub.addEventListener('change', function () { okPub.disabled = !cekPub.checked; });
  dlgPub.querySelector('[data-batal]').addEventListener('click', function () { dlgPub.close(); });
  okPub.addEventListener('click', function () {
    var item = data.filter(function (a) { return a.id === idPub; })[0];
    if (item) {
      item.status = 'terbit';
      render();
      KLH.toast('Konten <strong>' + item.id + '</strong> dipublikasikan di Website Utama (simulasi).');
    }
    dlgPub.close();
  });

  /* Hapus (simulasi + konfirmasi) */
  tb.addEventListener('click', function (e) {
    var pub = e.target.closest('[data-publish]');
    if (pub) {
      idPub = pub.getAttribute('data-publish');
      var target = data.filter(function (a) { return a.id === idPub; })[0];
      document.getElementById('publish-judul').textContent = target ? target.judul + ' (' + target.id + ')' : '—';
      cekPub.checked = false;
      okPub.disabled = true;
      dlgPub.showModal();
      return;
    }
    var btn = e.target.closest('[data-hapus]');
    if (!btn) return;
    var id = btn.getAttribute('data-hapus');
    var item = data.filter(function (a) { return a.id === id; })[0];
    if (item && window.confirm('Hapus "' + item.judul + '"?\nAksi ini simulasi prototipe.')) {
      data = data.filter(function (a) { return a.id !== id; });
      render();
      KLH.toast('Konten <strong>' + id + '</strong> dihapus (simulasi).');
    }
  });

  render();
})();
</script>
</body>
</html>
